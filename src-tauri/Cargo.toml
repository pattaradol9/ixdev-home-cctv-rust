[package]
name    = "ixdev-cctv"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["tray-icon", "image-png"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
axum        = { version = "0.7", features = ["ws"] }
futures     = "0.3"
url         = "2"
dpi         = "0.1"

