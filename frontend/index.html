<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ixdev-cctv</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png"     href="/favicon.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; overflow: hidden; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ── Header ───────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      box-shadow: 0 1px 8px rgba(0,0,0,0.5);
      flex-shrink: 0;
      height: 46px;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .rec-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #e53935;
      animation: blink 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    .logo h1 { font-size: 13px; font-weight: bold; letter-spacing: 3px; color: #fff; }

    .header-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

    #clock { font-size: 13px; font-weight: bold; color: #ccc; letter-spacing: 1px; }

    .logout-btn, .refresh-btn {
      font-size: 10px; letter-spacing: 1px; color: #555;
      background: none; font-family: 'Courier New', monospace;
      cursor: pointer; padding: 4px 9px; border: 1px solid #252525;
      transition: color 0.15s, border-color 0.15s;
    }
    .logout-btn:hover  { color: #e53935; border-color: #e53935; }
    .refresh-btn:hover { color: #4caf50; border-color: #4caf50; }
    .refresh-btn.spinning { animation: spin 0.6s linear; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }


    /* ── Grid ─────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      background: #0d0d0d;
      flex: 1;
      min-height: 0;
      padding: 2px;
    }

    .cell {
      position: relative;
      background: #050505;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #1a1a1a;
      transition: border-color 0.25s;
    }
    .cell:not(.empty):hover { border-color: #4caf50; }
    .cell.empty { cursor: default; border-color: #111; }
    .cell.live  { border-color: #1c2e1c; }
    .cell.live:hover { border-color: #4caf50; }

    .cam-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── No-signal ────────────────────────────────────── */
    .no-signal {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; background: #050505; pointer-events: none;
    }
    .no-signal .icon { opacity: 0.12; }
    .no-signal p { font-size: 10px; letter-spacing: 2px; color: #3a3a3a; }

    /* ── Camera overlays ──────────────────────────────── */
    .overlay-bottom {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 22px 8px 5px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      display: flex; align-items: flex-end; justify-content: space-between;
      pointer-events: none;
    }
    .cam-name { font-size: 10px; font-weight: bold; letter-spacing: 1px; color: #fff; text-shadow: 0 1px 4px #000; }
    .cam-time { font-size: 9px; color: #aaa; text-shadow: 0 1px 3px #000; }

    .chan-tag {
      position: absolute; top: 5px; left: 7px;
      font-size: 9px; color: rgba(255,255,255,0.35); letter-spacing: 1px; pointer-events: none;
    }

    .status-dot {
      position: absolute; top: 7px; right: 7px;
      width: 7px; height: 7px; border-radius: 50%;
      background: #4caf50; box-shadow: 0 0 5px #4caf50; pointer-events: none;
    }
    .status-dot.offline { background: #444; box-shadow: none; animation: none; }

    /* ── Login overlay ────────────────────────────────── */
    .login-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.97);
      z-index: 300; display: flex; align-items: center; justify-content: center;
    }
    .login-overlay.hidden { display: none; }

    .login-card {
      width: 340px; background: #111; border: 1px solid #222;
      padding: 32px 28px 28px; display: flex; flex-direction: column; gap: 14px;
    }

    .login-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: bold; letter-spacing: 3px; color: #fff;
    }
    .login-logo .rec-dot { flex-shrink: 0; }
    .login-divider { height: 1px; background: #1e1e1e; }
    .login-subtitle { font-size: 11px; color: #888; letter-spacing: 2px; }

    .login-field { display: flex; flex-direction: column; gap: 5px; }
    .login-field label { font-size: 9px; letter-spacing: 2px; color: #555; }
    .login-field input {
      background: #0a0a0a; border: 1px solid #222; color: #e0e0e0;
      font-family: 'Courier New', monospace; font-size: 13px;
      padding: 8px 10px; outline: none; width: 100%; transition: border-color 0.15s;
    }
    .login-field input:focus { border-color: #4caf50; }

    .login-btn {
      margin-top: 6px; background: #4caf50; color: #000; border: none;
      font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold;
      letter-spacing: 2px; padding: 10px; cursor: pointer; transition: background 0.15s; width: 100%;
    }
    .login-btn:hover:not(:disabled) { background: #66bb6a; }
    .login-btn:disabled { background: #1a1a1a; color: #444; cursor: default; }

    .login-error { font-size: 10px; color: #e53935; letter-spacing: 1px; min-height: 14px; text-align: center; }

    /* ── Fullscreen modal ─────────────────────────────── */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96);
      z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    .modal.open { display: flex; }
    .modal-canvas {
      width: min(96vw, calc(90vh * 16 / 9));
      aspect-ratio: 16 / 9;
      border: 1px solid #222;
    }
    .modal-footer { display: flex; align-items: center; gap: 16px; }
    .modal-label { font-size: 12px; letter-spacing: 2px; color: #555; }
    .modal-close {
      position: absolute; top: 14px; right: 18px;
      font-size: 22px; line-height: 1; cursor: pointer; color: #444; background: none; border: none;
    }
    .modal-close:hover { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="rec-dot"></div>
      <h1>IXDEV CCTV</h1>
    </div>

    <div class="header-right">
      <div id="clock"></div>
      <button class="refresh-btn" id="refresh-btn" title="Refresh All Cameras">&#x21BB;</button>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <!-- Login overlay -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <div class="rec-dot"></div>
        <span>IXDEV CCTV</span>
      </div>
      <div class="login-divider"></div>
      <p class="login-subtitle">DVR Login</p>
      <div class="login-field">
        <label for="login-ip">DVR IP ADDRESS</label>
        <input type="text" id="login-ip" spellcheck="false" autocomplete="off" placeholder="192.168.0.30">
      </div>
      <div class="login-field">
        <label for="login-user">USERNAME</label>
        <input type="text" id="login-user" autocomplete="off" placeholder="admin">
      </div>
      <div class="login-field">
        <label for="login-pass">PASSWORD</label>
        <input type="password" id="login-pass" autocomplete="off">
      </div>
      <button class="login-btn" id="login-btn">Login</button>
      <p class="login-error" id="login-error"></p>
    </div>
  </div>

  <!-- Fullscreen modal -->
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" title="Close (Esc)">✕</button>
    <canvas id="modal-canvas" class="modal-canvas"></canvas>
    <div class="modal-footer">
      <div class="status-dot" id="modal-dot"></div>
      <div class="modal-label" id="modal-label"></div>
    </div>
  </div>

  <script>
    let CAMERAS = 8;
    let SLOTS   = 9;

    // ── WebSocket per camera ────────────────────────────
    const wsMap = {};
    const reconnectTimers = {};
    let streamsPaused = false;

    function connectCamera(ch) {
      if (streamsPaused) return;

      const canvas = document.getElementById(`canvas-${ch}`);
      const ctx    = canvas.getContext('2d');
      const dot    = document.getElementById(`dot-${ch}`);
      const ns     = document.getElementById(`ns-${ch}`);
      const cell   = canvas.parentElement;

      // Throttle: at most 1 decode in-flight + 1 pending frame per camera.
      // Newer frames replace the pending one; Blob created only at decode time.
      let pendingData = null; // raw ArrayBuffer — cheaper to replace than Blob
      let decoding    = false;

      function processNext() {
        if (!pendingData || decoding) return;
        decoding = true;
        const buf = pendingData;
        pendingData = null;
        createImageBitmap(new Blob([buf], { type: 'image/jpeg' })).then(bitmap => {
          const w = canvas.parentElement.clientWidth;
          const h = canvas.parentElement.clientHeight;
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w; canvas.height = h;
          }
          ctx.drawImage(bitmap, 0, 0, w, h);
          bitmap.close();
          decoding = false;
          processNext();
        }).catch(() => { decoding = false; processNext(); });
      }

      const ws = new WebSocket(`ws://${location.host}/ws/${ch}`);
      ws.binaryType = 'arraybuffer'; // arraybuffer releases from the WKWebView networking
      wsMap[ch] = ws;               // process immediately; blob can linger until GC

      ws.onopen = () => {
        if (dot)  dot.className = 'status-dot';
        if (ns)   ns.style.display = 'none';
        if (cell) cell.classList.add('live');
      };

      ws.onmessage = (event) => {
        pendingData = event.data; // latest frame wins; old ArrayBuffer is GC'd immediately
        processNext();
      };

      ws.onclose = ws.onerror = () => {
        pendingBlob = null;
        if (dot)  dot.className = 'status-dot offline';
        if (ns)   ns.style.display = 'flex';
        if (cell) cell.classList.remove('live');
        wsMap[ch] = null;
        if (!streamsPaused) {
          reconnectTimers[ch] = setTimeout(() => { reconnectTimers[ch] = null; connectCamera(ch); }, 5000);
        }
      };
    }

    function startStreams() {
      for (let i = 1; i <= CAMERAS; i++) connectCamera(i);
    }

    function cancelReconnects() {
      Object.keys(reconnectTimers).forEach((ch) => {
        if (reconnectTimers[ch]) { clearTimeout(reconnectTimers[ch]); reconnectTimers[ch] = null; }
      });
    }

    function closeAllStreams() {
      cancelReconnects();
      Object.keys(wsMap).forEach((ch) => {
        const ws = wsMap[ch];
        if (ws) { ws.onclose = ws.onerror = null; ws.close(); wsMap[ch] = null; }
      });
      if (modalWS) { modalWS.close(); modalWS = null; }
    }

    // ── Pause / resume (called when window hides / shows) ──
    window.pauseStreams = function () {
      streamsPaused = true;
      closeAllStreams();
    };

    window.resumeStreams = function () {
      if (!streamsPaused) return;
      streamsPaused = false;
      if (!loginOverlay.classList.contains('hidden')) startStreams();
    };

    // ── Refresh (called by tray menu or refresh button) ──
    window.refreshAllCameras = function () {
      if (loginOverlay.classList.contains('hidden') === false) return;
      closeAllStreams();
      startStreams();
    };


    // ── Build grid ──────────────────────────────────────
    function buildGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const CAM_NAMES = Array.from({ length: CAMERAS }, (_, i) => `CAM ${i + 1}`);

      for (let i = 1; i <= SLOTS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (i > CAMERAS ? ' empty' : '');

        if (i <= CAMERAS) {
          const name = CAM_NAMES[i - 1] || `Camera ${i}`;
          cell.innerHTML = `
            <canvas id="canvas-${i}" class="cam-canvas"></canvas>
            <div class="no-signal" id="ns-${i}">
              <svg class="icon" width="42" height="42" viewBox="0 0 24 24" fill="none">
                <path fill="#fff" d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/>
                <line x1="2" y1="2" x2="22" y2="22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
              <p>NO SIGNAL</p>
            </div>
            <span class="chan-tag">CH ${i}</span>
            <div class="status-dot offline" id="dot-${i}"></div>
            <div class="overlay-bottom">
              <span class="cam-name">${name}</span>
              <span class="cam-time" id="time-${i}"></span>
            </div>
          `;
          cell.addEventListener('click', () => openModal(i, name));
        } else {
          cell.innerHTML = `
            <div class="no-signal">
              <svg class="icon" width="34" height="34" viewBox="0 0 24 24" fill="#fff">
                <path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/>
              </svg>
              <p>Empty</p>
            </div>
          `;
        }
        grid.appendChild(cell);
      }
    }

    // ── Login ───────────────────────────────────────────
    const loginOverlay = document.getElementById('login-overlay');
    const loginIp      = document.getElementById('login-ip');
    const loginUser    = document.getElementById('login-user');
    const loginPass    = document.getElementById('login-pass');
    const loginBtn     = document.getElementById('login-btn');
    const loginError   = document.getElementById('login-error');

    async function doLogin() {
      loginError.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Connecting...';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            dvr_ip:   loginIp.value.trim(),
            username: loginUser.value.trim(),
            password: loginPass.value,
          }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          loginOverlay.classList.add('hidden');
          startStreams();
        } else {
          loginError.textContent = data.error || 'Login failed';
        }
      } catch {
        loginError.textContent = 'Unable to connect to server';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    }

    loginBtn.addEventListener('click', doLogin);
    [loginIp, loginUser, loginPass].forEach((el) =>
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); })
    );

    // ── Init — fetch config then build UI ───────────────
    async function init() {
      let cfg = {};
      for (let i = 0; i < 20; i++) {
        try {
          cfg = await fetch('/api/config').then((r) => r.json());
          break;
        } catch {
          await new Promise((r) => setTimeout(r, 200));
        }
      }

      CAMERAS = cfg.cameras || 8;
      SLOTS   = cfg.slots   || 9;

      loginIp.value = cfg.dvr_ip || '';

      buildGrid();
      timeElCache = Array.from({ length: CAMERAS }, (_, i) => document.getElementById(`time-${i + 1}`)).filter(Boolean);

      if (cfg.logged_in) {
        loginOverlay.classList.add('hidden');
        startStreams();
      } else {
        loginIp.focus();
      }
    }

    // ── Clock ───────────────────────────────────────────
    const clockEl = document.getElementById('clock');
    let timeElCache = [];  // populated after buildGrid()

    function tick() {
      const now  = new Date();
      const date = now.toLocaleDateString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' });
      const time = now.toLocaleTimeString('en-GB');
      clockEl.textContent = `${date}  ${time}`;
      for (let i = 0; i < timeElCache.length; i++) {
        timeElCache[i].textContent = time;
      }
    }
    tick();
    setInterval(tick, 1000);

    // ── Fullscreen modal ────────────────────────────────
    const modal       = document.getElementById('modal');
    const modalCanvas = document.getElementById('modal-canvas');
    const modalCtx    = modalCanvas.getContext('2d');
    const modalLabel  = document.getElementById('modal-label');
    const modalDot    = document.getElementById('modal-dot');
    let   modalWS     = null;

    function openModal(ch, name) {
      if (modalWS) { modalWS.close(); modalWS = null; }

      // Clear any stale frame from a previous session
      modalCtx.clearRect(0, 0, modalCanvas.width, modalCanvas.height);

      const ws = new WebSocket(`ws://${location.host}/ws/${ch}?hd=1`);
      ws.binaryType = 'arraybuffer';
      modalWS = ws;

      // Skip the first few frames — DVR HD encoder outputs gray/corrupt frames on startup
      let warmup = 5;
      let modalPendingData = null;
      let modalDecoding    = false;

      function processModalNext() {
        if (!modalPendingData || modalDecoding) return;
        modalDecoding = true;
        const buf = modalPendingData;
        modalPendingData = null;
        createImageBitmap(new Blob([buf], { type: 'image/jpeg' })).then(bitmap => {
          if (modalCanvas.width !== bitmap.width || modalCanvas.height !== bitmap.height) {
            modalCanvas.width  = bitmap.width;
            modalCanvas.height = bitmap.height;
            modalCtx.imageSmoothingEnabled = true;
            modalCtx.imageSmoothingQuality = 'high';
          }
          modalCtx.drawImage(bitmap, 0, 0, bitmap.width, bitmap.height);
          bitmap.close();
          modalDecoding = false;
          processModalNext();
        }).catch(() => { modalDecoding = false; processModalNext(); });
      }

      ws.onopen  = () => { modalDot.className = 'status-dot'; };

      ws.onmessage = (event) => {
        if (warmup > 0) { warmup--; return; }
        modalPendingData = event.data;
        processModalNext();
      };

      ws.onclose = ws.onerror = () => { modalDot.className = 'status-dot offline'; };

      modalLabel.textContent = `CH ${ch}  ·  ${name}`;
      modal.classList.add('open');
    }

    function closeModal() {
      if (modalWS) { modalWS.close(); modalWS = null; }
      modal.classList.remove('open');
      modalCtx.clearRect(0, 0, modalCanvas.width, modalCanvas.height);
    }

    // ── Logout ──────────────────────────────────────────
    document.getElementById('logout-btn').addEventListener('click', async () => {
      Object.values(wsMap).forEach((ws) => ws && ws.close());
      if (modalWS) { modalWS.close(); modalWS = null; }
      await fetch('/logout', { method: 'POST' }).catch(() => {});
      window.location.reload();
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    document.getElementById('refresh-btn').addEventListener('click', () => {
      const btn = document.getElementById('refresh-btn');
      btn.classList.remove('spinning');
      void btn.offsetWidth;
      btn.classList.add('spinning');
      window.refreshAllCameras();
      btn.addEventListener('animationend', () => btn.classList.remove('spinning'), { once: true });
    });

    init();

    // Pause streams when window is hidden (minimised/backgrounded) to stop RAM accumulating
    // in the macOS WKWebView Networking process. Resume on show.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) window.pauseStreams();
      else if (!loginOverlay.classList.contains('hidden')) window.resumeStreams();
    });

    // ponytail: periodic reconnect flushes Networking process TCP buffers that
    // accumulate over long sessions; 90 min is enough for a 24/7 CCTV install.
    setInterval(() => {
      if (!loginOverlay.classList.contains('hidden') && !document.hidden) window.refreshAllCameras();
    }, 90 * 60 * 1000);
  </script>

</body>
</html>
